x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "1800"
    AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT_DETECTION_INTERVAL: "120"
    AIRFLOW__SCHEDULER__ZOMBIE_DETECTION_INTERVAL: "120"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/project-scripts:ro
    - ./tests:/opt/airflow/tests
    - ./secrets:/opt/airflow/secrets:ro
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  restart: always

services:
  airflow-init:
    <<: *airflow-common
    env_file: .env
    entrypoint: ["/bin/bash", "/opt/project-scripts/airflow-with-db-password-aws.sh"]
    command: ["/bin/bash", "-lc", "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER:-airflow} --password ${AIRFLOW_ADMIN_PASSWORD:-airflow} --firstname Air --lastname Flow --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"]

  airflow-webserver:
    <<: *airflow-common
    env_file: .env
    entrypoint: ["/bin/bash", "/opt/project-scripts/airflow-with-db-password-aws.sh"]
    command: ["airflow", "webserver"]
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW_PUBLIC_BASE_URL}
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    env_file: .env
    entrypoint: ["/bin/bash", "/opt/project-scripts/airflow-with-db-password-aws.sh"]
    command: ["airflow", "scheduler"]

  caddy:
    image: caddy:2.8
    depends_on:
      - airflow-webserver
      - metabase
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      METABASE_PUBLIC_DOMAIN: ${METABASE_PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

  metabase:
    image: metabase/metabase:v0.56.5
    env_file: .env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase}
      MB_DB_PORT: ${METABASE_DB_PORT:-5432}
      MB_DB_USER: ${METABASE_DB_USER:-metabase}
      MB_DB_HOST: ${METABASE_DB_HOST:-postgres}
      MB_SITE_URL: ${METABASE_PUBLIC_BASE_URL}
    ports:
      - "3000:3000"
    restart: always

volumes:
  caddy-data:
  caddy-config:
